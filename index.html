<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Minecraft Skin Stream</title>
    <style>
      :root,
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent !important;
      }

      #overlay {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        background: transparent;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="overlay" aria-label="Animated Minecraft skin overlay"></canvas>
    <script src="skins.generated.js"></script>
    <script src="overlay.js"></script>
  </body>
</html>
